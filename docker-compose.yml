services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamtrack
      POSTGRES_PASSWORD: teamtrack_pass
      POSTGRES_DB: teamtrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamtrack -d teamtrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
